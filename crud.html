<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 4</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    #app {
        background-color: #ffffff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        width: 400px;
        max-width: 100%;
    }

    form {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
        color: #333333;
    }

    input[type="text"] {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
    }

    button {
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        color: #ffffff;
        margin-right: 8px;
    }

    button[type='submit'] {
        background-color: #4CAF50;
        margin: 8px;
    }

    button:last-of-type {
        background-color: #f44336;
        margin: 8px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }

    th, td {
        padding: 12px;
        text-align: center;
        border-bottom: 1px solid #e0e0e0;
    }

    th {
        background-color: #4CAF50;
        color: white;
        font-weight: bold;
    }

    tr:nth-child(even) {
        background-color: #f9f9f9;
    }

    tr:hover {
        background-color: #f1f1f1;
    }

    td button {
        background-color: #008CBA;
        border: none;
        padding: 6px 12px;
        color: #ffffff;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        margin: 0 4px;
    }

    td button.delete {
        background-color: #f44336;
    }

    td button.edit {
        background-color: #4CAF50;
    }

     .birthdate-col {
        width: 120px; 
    }
    .name-col {
        width: 100px; 
    }
</style>

<body>
    <div id="app">
        <form v-on:submit.prevent="save">
            <label for="">Họ và tên</label>
            <input type="text" v-model="fullName"> <br>
            <label for="">Ngày sinh</label>
            <input type="text" v-model="birthdate"> <br>
            <label for="">Điểm</label>
            <input type="text" v-model="mark"> <br>
            <button type="submit" @:click="add()">Thêm</button>
            <button type="submit">Lưu</button>
            <button @:click="cancel">Hủy</button>
        </form>

        <table border="1" style="border-collapse: collapse;">
            <tr>
                <th>Họ và tên</th>
                <th>Ngày sinh</th>
                <th>Điểm</th>
                <th>Chức năng</th>
            </tr>
            <tr v-for="(item, index) in students" :key="index">
                <td class="name-col">{{item.fullName}}</td>
                <td class="birthdate-col">{{item.birthdate}}</td>
                <td>{{item.mark}}</td>
                <td>
                    <button @:click="edit(index)">Sửa</button>
                    <button @:click="deleteStudent(index)">Xóa</button>
                
                </td>
            </tr>
        </table>
    </div>
</body>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
    const app = Vue.createApp({
        data() {
            return {
                fullName: '',
                birthdate: '',
                mark: '',
                index: null,
                students: [
                    {
                        fullName: 'Chí Phèo',
                        birthdate: '01-01-2010',
                        mark: 8.5
                    },
                    {
                        fullName: 'Thị Nở',
                        birthdate: '01-01-2015',
                        mark: 9
                    }
                ],

            };
        },
        methods: {
            edit(index) {
                const student = this.students[index];
                this.fullName = student.fullName;
                this.birthdate = student.birthdate;
                this.mark = student.mark;
                this.index = index;
            },
            save() {
                const update = this.students[this.index]
                update.fullName = this.fullName;
                update.birthdate = this.birthdate;
                update.mark = this.mark;
            },
            cancel() {
                this.fullName = '',
                this.birthdate = '',
                this.mark = ''
                this.index = null;
            },
            deleteStudent(index){
                this.students.splice(index, 1);
                this.cancel();
            },
            add(){
                const newStudent = {
                    fullName: this.fullName,
                    birthdate: this.birthdate,
                    mark: this.mark
                };
                this.students.push(newStudent);
                this.cancel();  
            }
        }
    });
    app.mount('#app');
</script>

</html>
