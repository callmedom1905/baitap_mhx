<!DOCTYPE html>

    <meta charset="UTF-8">

<style>
    #hv{
        width: 200px;
        height: 200px;
        border: 1px solid #333;
        margin-bottom: 20px;
    }
    #blue, #green, #pink{
        width: 30px;
        height: 30px;
        border-radius: 30px;
        float: left;
        margin: 20px;
    }
    #blue{
        background-color: lightblue;
    }
    #green{
        background-color: lightgreen;
    }
    #pink{
        background-color: pink;
    }
    button{
        width: 70px;
        margin: 10px;
        height: 20px;

    }
</style>
<body onload="loadNewPro()">
    <!-- DOM -->
    <!-- Gọi element -->
    <div id="hv" ></div>
    <div id="blue" onmouseover="setcolor(1)" onmouseout="resetColor()"></div>
    <div id="green" onmouseover="setcolor(2)" onmouseout="resetColor()"></div>
    <div id="pink" onmouseover="setcolor(3)" onmouseout="resetColor()"></div>
    <br>
    <button>L</button>
    <button>XL</button>
  
    <script>
        function setcolor(x){
            switch (x){
                case 1:
                    document.getElementById('hv').style.backgroundColor = 'lightblue';
                    break;
                case 2:
                    document.getElementById('hv').style.backgroundColor = 'lightgreen';
                    break;
                case 3:
                    document.getElementById('hv').style.backgroundColor = 'pink';
                    break;
                default:

                    break;
            }
        }
        function resetColor(){
            document.getElementById('hv').style.backgroundColor = "white";
        }
        // cách 2
        //const: hằng số
        //let: phạm vi cục bộ trong block
        //var: phạm vi cục bộ trong hàm
        let button = document.getElementsByTagName('button');
        console.log(button);
        button[0].addEventListener('click', function(){
            document.getElementById('hv').style.width = '200px';
            document.getElementById('hv').style.height = '200px';
        })
        button[1].addEventListener('click', function(){
            document.getElementById('hv').style.width = '300px';
            document.getElementById('hv').style.height = '300px';
        })
        
    </script>
      
      <input type="number" name="" id="" placeholder="nhập số thứ 1">
      <input type="number" name="" id="" placeholder="nhập số thứ 2">
      <input type="number" name="" id="" placeholder="nhập số thứ 3">
      <input type="number" name="" id="" placeholder="nhập số thứ 4">
      <input type="number" name="" id="" placeholder="nhập số thứ 5">
      <button onclick="result()">Kết quả</button>
      <div id="kq"></div>
    <script>
        let arr = []; //mảng chứa giá trị
        function result(){
            let inp = document.getElementsByTagName('input'); //mảng chứa thẻ input
            for(let i = 0; i < inp.length ; i++){
                arr.push(inp[i].value);
            }
            let tong = sum();
            let tich = 1;
            arr.forEach(i => {
                tich = tich * parseInt(i);

            });
            document.getElementById('kq').innerHTML = `<h2>Tổng là: <span>${tong}<span></h2>
                <h2>Tích là: <span>${tich}<span></h2>`;
        }
        function sum(){
            let tong = 0;
            for(let i = 0; i < arr.length ; i++){
                tong += parseInt(arr[i]); //ép kiểu
                
            }
            return tong;
        }

    </script>
